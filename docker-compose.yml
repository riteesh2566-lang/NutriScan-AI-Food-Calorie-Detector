version: '3.8'

services:
  # 1. MySQL Database Service
  db:
    image: mysql:8.0
    container_name: nutriscan-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: food_calorie_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Initialize database schema automatically on bootstrap
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      timeout: 10s
      retries: 5

  # 2. FastAPI Backend Application Service
  backend:
    build: ./backend
    container_name: nutriscan-backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@db:3306/food_calorie_db
      - JWT_SECRET=8f9a2b8e3c1d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f
      - USDA_API_KEY=DEMO_KEY
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/workspace/uploads
    depends_on:
      db:
        condition: service_healthy

  # 3. Nginx Web/Frontend Service
  frontend:
    image: nginx:alpine
    container_name: nutriscan-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_uploads:
